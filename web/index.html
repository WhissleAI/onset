<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Onset</title>
<meta name="description" content="Ask out loud. The answer is ready when you stop talking.">
<link rel="stylesheet" href="onset.css?v=1">
</head>
<body>
<header class="bar">
  <div class="brand"><span class="mark" aria-hidden="true"><i></i><i></i><i></i></span>Onset</div>
  <div class="bar-r">
    <span class="status" id="status" hidden><i></i><b>Getting ready…</b></span>
    <button class="ghost" id="newChat" type="button" title="Start a new conversation (⌘N)" hidden>New chat</button>
    <button class="icon" id="settingsBtn" type="button" title="Settings (⌘,)" aria-label="Settings" hidden>
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M19.4 13a7.5 7.5 0 0 0 0-2l2-1.6-2-3.4-2.4 1a7.4 7.4 0 0 0-1.7-1L15 3.5h-4L10.7 6a7.4 7.4 0 0 0-1.7 1l-2.4-1-2 3.4L4.6 11a7.5 7.5 0 0 0 0 2l-2 1.6 2 3.4 2.4-1c.5.4 1.1.7 1.7 1l.3 2.5h4l.3-2.5c.6-.3 1.2-.6 1.7-1l2.4 1 2-3.4-2-1.6ZM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7Z"/></svg>
    </button>
  </div>
</header>
<div class="notice" id="notice" role="status" aria-live="polite" hidden></div>

<main class="thread" id="thread" aria-live="polite">
  <section class="hello" id="hello">
    <h1>Ask anything.</h1>
    <p>Hold <kbd>Space</kbd> and speak. The answer is ready when you stop.</p>
    <div class="try" id="try">
      <button type="button">What's the weather in Tokyo tomorrow</button>
      <button type="button">Who founded Nvidia</button>
      <button type="button">How many ounces in a cup</button>
      <button type="button">Find my resume</button>
    </div>
  </section>
</main>

<footer class="dock">
  <form class="ask" id="typeForm" autocomplete="off" role="search">
    <input id="typeBox" type="text" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off"
           writingsuggestions="false" enterkeyhint="search" aria-label="Ask a question" placeholder="Ask anything">
    <button id="micBtn" class="mic" type="button" title="Click to talk, or hold Space" aria-label="Talk">
      <span class="ring" id="micRing"></span>
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-2.08A7 7 0 0 0 19 12h-2Z"/></svg>
    </button>
  </form>
  <p class="hint" id="hint">Hold <kbd>Space</kbd> to talk · <kbd>/</kbd> to type</p>
</footer>
<audio id="player" preload="auto"></audio>
<script src="onset.js?v=1"></script>
</body>
</html>
